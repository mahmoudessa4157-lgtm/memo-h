<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M3MO Host</title>
<style>
  :root { --bg:#050505; --panel:#111; --text:#0f0; --accent:#ff003c; --border:#333; }
  * { box-sizing:border-box; margin:0; padding:0; font-family:'Courier New', monospace; }
  body { background:var(--bg); color:#ccc; display:flex; justify-content:center; align-items:center; height:100vh; margin:0; }
  .box { width:100%; max-width:600px; background:var(--panel); padding:30px; border:1px solid var(--border); border-radius:10px; box-shadow:0 0 20px rgba(255,0,60,0.2); max-height:90vh; overflow-y:auto; }
  h1 { color:var(--accent); text-align:center; margin-bottom:20px; font-size:24px; text-shadow:0 0 10px var(--accent); }
  .input-group { margin-bottom:15px; }
  label { display:block; margin-bottom:5px; font-size:12px; color:#888; }
  input, textarea { width:100%; padding:12px; background:#000; border:1px solid var(--border); color:var(--text); border-radius:4px; outline:none; }
  textarea { height:150px; resize:vertical; font-size:12px; font-family: monospace; }
  input:focus, textarea:focus { border-color:var(--accent); box-shadow:0 0 5px var(--accent); }
  button { width:100%; padding:15px; background:var(--accent); color:#fff; border:none; border-radius:4px; font-weight:bold; cursor:pointer; transition:0.3s; font-size:16px; }
  button:hover { background:#cc0030; box-shadow:0 0 15px var(--accent); }
  .logs { margin-top:20px; background:#000; padding:15px; border:1px solid var(--border); border-radius:4px; height:100px; overflow-y:auto; font-size:12px; color:var(--text); }
</style>
</head>
<body>
<div class="box">
  <h1>M3MO BOT HOSTING</h1>
  <div class="input-group">
    <label>Bot Token (من BotFather)</label>
    <input type="text" id="botToken" placeholder="8781731878:AAFu...">
  </div>
  <div class="input-group">
    <label>Bot Code (JavaScript فقط)</label>
    <textarea id="botCode" placeholder="// اكتب كود البوت هنا بالجافاسكريبت..."></textarea>
  </div>
  <button onclick="deployBot()" id="btn">Deploy & Run Bot 🚀</button>
  <div class="logs" id="logs">> System Ready...</div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDGabYD9eTmgKzegk_oRJfj6R6Y8ogk2vc",
    authDomain: "memo-hosteng.firebaseapp.com",
    databaseURL: "https://memo-hosteng-default-rtdb.firebaseio.com",
    projectId: "memo-hosteng",
    storageBucket: "memo-hosteng.firebasestorage.app",
    messagingSenderId: "76655832366",
    appId: "1:76655832366:web:2814584d7d574fbdd21ebf",
    measurementId: "G-95YT9YFV13"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  window.deployBot = async function() {
    const token = document.getElementById('botToken').value.trim();
    const code = document.getElementById('botCode').value.trim();
    const btn = document.getElementById('btn');
    const logs = document.getElementById('logs');
    
    if (!token || !code) { logs.innerHTML = "> [ERROR] حط التوكن والكود!"; return; }
    btn.disabled = true; btn.innerText = "جاري التشغيل...";
    logs.innerHTML += "<br>> Connecting to Firebase...";
    
    const domain = window.location.origin;
    const webhookUrl = domain + "/api/webhook?token=" + token;
    
    try {
      await set(ref(db, 'bots/' + token), { code: code, webhook: webhookUrl, created_at: Date.now() });
      logs.innerHTML += "<br>> [OK] Saved to Firebase";

      const res = await fetch('/api/setup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, webhookUrl })
      });
      const data = await res.json();
      
      if (data.ok) {
        logs.innerHTML += "<br>> [SUCCESS] البوت شغال ٢٤/٧!";
        btn.innerText = "البوت شغال ✅"; btn.style.background = "#00aa00";
      } else {
        logs.innerHTML += "<br>> [ERROR] " + data.description;
        btn.disabled = false; btn.innerText = "Deploy & Run Bot 🚀";
      }
    } catch (e) {
      logs.innerHTML += "<br>> [CRITICAL] " + e.message;
      btn.disabled = false; btn.innerText = "Deploy & Run Bot 🚀";
    }
    logs.scrollTop = logs.scrollHeight;
  }
</script>
</body>
</html>
